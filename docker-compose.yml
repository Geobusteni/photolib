services:
  db:
    image: postgres:16-alpine
    container_name: photolib-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: photolib
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-this-password}
      POSTGRES_DB: photolib
    volumes:
      - photolib-db-data:/var/lib/postgresql/data
    networks:
      - photolib-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photolib"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: photolib-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"  # Exposes container port 3000 to host (reverse proxy connects here)
    environment:
      DATABASE_URL: postgresql://photolib:${DB_PASSWORD:-change-this-password}@db:5432/photolib
      SESSION_SECRET: ${SESSION_SECRET}
      UPLOAD_DIR: /app/uploads
      NODE_ENV: production
    volumes:
      - photolib-uploads:/app/uploads
      - ./prisma:/app/prisma
    networks:
      - photolib-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  photolib-db-data:
    driver: local
  photolib-uploads:
    driver: local

networks:
  photolib-network:
    driver: bridge
